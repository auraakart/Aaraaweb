version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node 22 is the supported runtime. A newer type major needs a runtime migration.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      admin-react-framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      lint-toolchain:
        patterns:
          - "eslint"
          - "typescript-eslint"
      nestjs-major:
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-express"
        update-types:
          - "major"
      prisma-major:
        patterns:
          - "prisma"
          - "@prisma/client"
        update-types:
          - "major"
  - package-ecosystem: pub
    directory: /apps/resident
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pub
    directory: /apps/guard
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
