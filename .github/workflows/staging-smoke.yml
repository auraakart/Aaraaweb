name: Staging smoke

on:
  pull_request:
    branches: [staging]
  push:
    branches: [develop, staging]
  workflow_dispatch:

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  staging-smoke:
    name: Staging API smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaraagate_staging_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aaraagate_staging_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaraagate_staging_smoke
      REDIS_URL: redis://localhost:6379
      PORT: 3000
      NODE_ENV: production
      APP_VERSION: staging-smoke
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OTP_DELIVERY_PROVIDER: msg91
      MSG91_AUTH_KEY: staging-smoke-placeholder
      MSG91_OTP_TEMPLATE_ID: staging-smoke-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact candidate evidence
        env:
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p staging-evidence
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_SHA" = "$CANDIDATE_SHA"
          {
            echo "# Aaraagate staging evidence"
            echo
            echo "- Candidate SHA: ${CANDIDATE_SHA}"
            echo "- Checked-out SHA: ${CHECKED_OUT_SHA}"
            echo "- Source ref: ${SOURCE_REF}"
            echo "- Target ref: ${TARGET_REF}"
            echo "- Target SHA at workflow start: ${TARGET_SHA}"
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > staging-evidence/staging-evidence.md

      - name: Enforce develop to staging promotion path
        if: github.event_name == 'pull_request'
        env:
          SOURCE_REF: ${{ github.head_ref }}
          TARGET_REF: ${{ github.base_ref }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$SOURCE_REF" != "develop" ] || [ "$TARGET_REF" != "staging" ]; then
            echo "Staging promotions must come from develop."
            exit 1
          fi
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${TARGET_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$CANDIDATE_SHA"; then
            echo "Staging history is not an ancestor of the candidate. Reconcile staging into develop first."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aaraagate/api prisma:generate

      - name: Apply staging migrations
        run: pnpm --filter @aaraagate/api prisma:migrate:deploy

      - name: Build API
        run: pnpm --filter @aaraagate/api build

      - name: Start API
        run: |
          pnpm --filter @aaraagate/api start > /tmp/aaraagate-api.log 2>&1 &
          echo $! > /tmp/aaraagate-api.pid

      - name: Wait for readiness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready > /tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat /tmp/aaraagate-api.log || true
          exit 1

      - name: Assert readiness response and release metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/readiness.json', 'utf8'));
          const expected = {
            status: 'ready',
            service: 'aaraagate-api',
            environment: 'production',
            version: process.env.APP_VERSION,
            commit: process.env.GIT_SHA,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (h[key] !== value) {
              console.error(`Unexpected ${key}:`, h[key], 'expected:', value);
              process.exit(1);
            }
          }
          if (h.dependencies?.database !== 'ok' || h.dependencies?.authState !== 'redis-ok') {
            console.error('Dependency readiness missing or unhealthy:', h.dependencies);
            process.exit(1);
          }
          NODE
          cp /tmp/readiness.json staging-evidence/readiness.json

      - name: Verify liveness endpoint and release metadata
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/live > /tmp/liveness.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/liveness.json', 'utf8'));
          if (
            h.status !== 'ok' ||
            h.service !== 'aaraagate-api' ||
            h.environment !== 'production' ||
            h.version !== process.env.APP_VERSION ||
            h.commit !== process.env.GIT_SHA
          ) {
            console.error(h);
            process.exit(1);
          }
          NODE

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/aaraagate-api.pid ]; then
            kill $(cat /tmp/aaraagate-api.pid) || true
          fi

      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/aaraagate-api.log || true

      - name: Upload exact-SHA staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.run_id }}
          path: staging-evidence/
          if-no-files-found: error
          retention-days: 30
