name: Post-main health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-main-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promoted main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate V4.41 repository contract
        run: node scripts/check-v4.41-maintainability.mjs

      - name: Fetch canonical branches
        run: git fetch origin develop staging main --no-tags

      - name: Verify canonical source containment
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          DEVELOP_SHA="$(git rev-parse refs/remotes/origin/develop)"
          STAGING_SHA="$(git rev-parse refs/remotes/origin/staging)"
          MAIN_TREE="$(git rev-parse "$MAIN_SHA^{tree}")"
          DEVELOP_TREE="$(git rev-parse "$DEVELOP_SHA^{tree}")"
          STAGING_TREE="$(git rev-parse "$STAGING_SHA^{tree}")"

          # Release promotion uses squash commits, so ancestry can diverge even
          # when the promoted source is byte-for-byte identical. Compare the
          # canonical branch tips directly instead of comparing merge-base ancestry.
          if ! git diff --quiet "$DEVELOP_SHA" "$MAIN_SHA" -- .; then
            echo "Develop source differs from promoted main."
            exit 1
          fi

          if ! git diff --quiet "$STAGING_SHA" "$MAIN_SHA" -- .; then
            echo "Staging source differs from promoted main."
            exit 1
          fi

          mkdir -p post-main-health-evidence
          node -e "require('fs').writeFileSync('post-main-health-evidence/summary.json', JSON.stringify({main:'$MAIN_SHA',develop:'$DEVELOP_SHA',staging:'$STAGING_SHA',mainTree:'$MAIN_TREE',developTree:'$DEVELOP_TREE',stagingTree:'$STAGING_TREE',sourceEquivalence:'ok',generatedAt:new Date().toISOString()}, null, 2))"

      - name: Publish post-main health evidence
        if: always()
        run: |
          echo "### Post-main source-equivalence evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -f post-main-health-evidence/summary.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat post-main-health-evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Post-main evidence file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload post-main health evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: post-main-health-${{ github.sha }}
          path: post-main-health-evidence/
          if-no-files-found: error
          retention-days: 7
