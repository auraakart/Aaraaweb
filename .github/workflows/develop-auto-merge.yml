name: Develop auto merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge green mastermind PR to develop
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and merge exact tested PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          prs="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/pulls?state=open&base=develop&per_page=100")"

          pr_number="$(printf '%s' "$prs" | jq -r \
            --arg sha "$TESTED_SHA" \
            '[.[] | select(
              .head.sha == $sha and
              .base.ref == "develop" and
              .head.repo.full_name == env.REPOSITORY and
              (.head.ref | startswith("mastermind/")) and
              (.draft == false)
            )] | if length == 1 then .[0].number else empty end')"

          if [ -z "$pr_number" ]; then
            echo "No eligible open mastermind PR targets develop at exact tested SHA $TESTED_SHA."
            exit 0
          fi

          current="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/pulls/$pr_number")"
          current_sha="$(printf '%s' "$current" | jq -r '.head.sha')"
          current_base="$(printf '%s' "$current" | jq -r '.base.ref')"
          current_state="$(printf '%s' "$current" | jq -r '.state')"
          current_draft="$(printf '%s' "$current" | jq -r '.draft')"
          current_repo="$(printf '%s' "$current" | jq -r '.head.repo.full_name')"
          current_ref="$(printf '%s' "$current" | jq -r '.head.ref')"

          test "$current_sha" = "$TESTED_SHA"
          test "$current_base" = "develop"
          test "$current_state" = "open"
          test "$current_draft" = "false"
          test "$current_repo" = "$REPOSITORY"

          case "$current_ref" in
            mastermind/*) ;;
            *) echo "Head branch is outside mastermind/*"; exit 1 ;;
          esac

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=squash \
            -f sha="$TESTED_SHA"

          echo "Merged PR #$pr_number to develop at tested SHA $TESTED_SHA."
