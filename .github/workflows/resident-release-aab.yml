name: Resident Release AAB

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version label, for example 1.0.0
        required: true
        type: string
      api_base_url:
        description: Production HTTPS API base URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resident-release-aab
  cancel-in-progress: false

jobs:
  build-signed-aab:
    name: Build signed Resident AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          [[ "$API_BASE_URL" =~ ^https:// ]] || { echo 'api_base_url must use HTTPS' >&2; exit 1; }
          [[ ! "$API_BASE_URL" =~ (localhost|127\.0\.0\.1) ]] || { echo 'api_base_url must not be local' >&2; exit 1; }
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Required Android signing secret is missing: $name" >&2; exit 1; }
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        working-directory: apps/resident
        run: flutter create --platforms=android --project-name aaraagate_resident --org com.aaraaplatforms .

      - name: Restore validated Resident source and prepare release compatibility
        run: |
          set -euo pipefail
          git checkout -- apps/resident/pubspec.yaml apps/resident/lib apps/resident/test
          rm -f apps/resident/analysis_options.yaml apps/resident/test/widget_test.dart
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' apps/resident/lib/theme/aaraagate_theme.dart
          APP_GRADLE=$(find apps/resident/android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)
          test -n "$APP_GRADLE"
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APP_GRADLE"

      - name: Install Android upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > apps/resident/android/app/upload-keystore.jks
          test -s apps/resident/android/app/upload-keystore.jks

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/resident/android/app/upload-keystore.jks"
          python - <<'PY'
          from pathlib import Path
          import os

          app = Path('apps/resident/android/app')
          kts = app / 'build.gradle.kts'
          groovy = app / 'build.gradle'

          if kts.exists():
              text = kts.read_text()
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('Could not locate buildTypes block in build.gradle.kts')
              signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n\n'''
              text = text.replace(marker, signing + marker, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              if old not in text:
                  raise SystemExit('Could not locate default release signing config in build.gradle.kts')
              text = text.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('Could not locate buildTypes block in build.gradle')
              signing = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n\n'''
              text = text.replace(marker, signing + marker, 1)
              candidates = [
                  'signingConfig signingConfigs.debug',
                  'signingConfig = signingConfigs.debug',
              ]
              for old in candidates:
                  if old in text:
                      text = text.replace(old, 'signingConfig signingConfigs.release', 1)
                      break
              else:
                  raise SystemExit('Could not locate default release signing config in build.gradle')
              groovy.write_text(text)
          else:
              raise SystemExit('No Android app Gradle file found')
          PY
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/resident/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Get dependencies
        working-directory: apps/resident
        run: flutter pub get

      - name: Analyze Resident app
        working-directory: apps/resident
        run: flutter analyze --no-fatal-infos

      - name: Test Resident app
        working-directory: apps/resident
        run: flutter test

      - name: Build signed release AAB
        working-directory: apps/resident
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/resident/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --dart-define=AARAGATE_DEMO_MODE=false
          --dart-define=AARAGATE_API_BASE_URL="$API_BASE_URL"

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB=apps/resident/build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict "$AAB"

      - name: Prepare release artifact
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/resident/build/app/outputs/bundle/release/app-release.aab \
            "dist/Aaraagate-Resident-${RELEASE_VERSION}-${GITHUB_SHA::12}.aab"
          sha256sum dist/*.aab > dist/SHA256SUMS.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: aaraagate-resident-signed-aab-${{ inputs.release_version }}
          path: |
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
