name: V5.14.12 one-time canonical tenant inventory bootstrap

on:
  push:
    branches:
      - mastermind/v5.14.12-analytics-context

permissions:
  contents: write

jobs:
  canonical-register:
    name: Regenerate exact inventory on feature branch
    if: github.repository == 'auraakart/Aaraaweb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked deps
        run: pnpm install --frozen-lockfile
      - name: Rebuild source-bound inventory
        run: |
          node services/api/scripts/tenant-access-inventory.mjs --write
          node scripts/sync-tenant-access-summary.mjs --write
          node services/api/scripts/tenant-access-inventory.mjs --check
          node scripts/sync-tenant-access-summary.mjs
      - name: Commit only generated canonical evidence on feature branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/v5-tenant-access-inventory.json docs/architecture/V5-TENANT-ACCESS-INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'V5.14.12: regenerate canonical tenant access inventory'
            git push origin HEAD:refs/heads/mastermind/v5.14.12-analytics-context
          fi
