name: V2 Pilot Acceptance Contract

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate-pilot-acceptance:
    name: Validate pilot acceptance plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V2 pilot acceptance execution plan
        run: node scripts/check-v2-pilot-acceptance-plan.mjs
