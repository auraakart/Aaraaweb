name: V2 Role UAT Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-role-uat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plan:
    name: Validate role UAT plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V2 role UAT execution plan
        run: node scripts/check-v2-role-uat-plan.mjs
