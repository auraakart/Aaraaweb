name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository structure
        run: |
          test -f package.json
          test -f pnpm-workspace.yaml
          test -d apps/web
          test -d apps/resident
          test -d apps/security
          test -d services/api
          test -d packages/types
          test -d packages/api-client
          test -d packages/config
