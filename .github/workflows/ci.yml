name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      release_control_only: ${{ steps.detect.outputs.release_control_only }}
      run_api: ${{ steps.detect.outputs.run_api }}
      run_performance: ${{ steps.detect.outputs.run_performance }}
      run_admin: ${{ steps.detect.outputs.run_admin }}
      run_flutter: ${{ steps.detect.outputs.run_flutter }}
      run_resident: ${{ steps.detect.outputs.run_resident }}
      run_guard: ${{ steps.detect.outputs.run_guard }}
      run_dependency_audit: ${{ steps.detect.outputs.run_dependency_audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "run_performance=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Main is promoted only from the already validated staging branch.
            # When the promoted tree is still byte-for-byte identical to staging,
            # keep the lightweight repository gate but do not rerun the expensive
            # API/Admin/Flutter/dependency suites a second time after merge.
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git fetch origin staging --no-tags
              MAIN_TREE="$(git rev-parse 'HEAD^{tree}')"
              STAGING_TREE="$(git rev-parse 'refs/remotes/origin/staging^{tree}')"
              if [ "$MAIN_TREE" = "$STAGING_TREE" ]; then
                echo "docs_only=false" >> "$GITHUB_OUTPUT"
                echo "release_control_only=false" >> "$GITHUB_OUTPUT"
                echo "run_api=false" >> "$GITHUB_OUTPUT"
                echo "run_admin=false" >> "$GITHUB_OUTPUT"
                echo "run_flutter=false" >> "$GITHUB_OUTPUT"
                echo "run_resident=false" >> "$GITHUB_OUTPUT"
                echo "run_guard=false" >> "$GITHUB_OUTPUT"
                echo "run_dependency_audit=false" >> "$GITHUB_OUTPUT"
                echo "Exact staging tree already passed protected pre-main validation; duplicate full suites skipped."
                exit 0
              fi
              echo "Main tree differs from current staging; falling back to full validation."
            fi

            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_control_only=false" >> "$GITHUB_OUTPUT"
            echo "run_api=true" >> "$GITHUB_OUTPUT"
            echo "run_admin=true" >> "$GITHUB_OUTPUT"
            echo "run_flutter=true" >> "$GITHUB_OUTPUT"
            echo "run_resident=true" >> "$GITHUB_OUTPUT"
            echo "run_guard=true" >> "$GITHUB_OUTPUT"
            echo "run_dependency_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE_SHA" "${{ github.sha }}" > /tmp/aaraagate-changed-files.txt

          if [ ! -s /tmp/aaraagate-changed-files.txt ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_control_only=false" >> "$GITHUB_OUTPUT"
            echo "run_api=true" >> "$GITHUB_OUTPUT"
            echo "run_admin=true" >> "$GITHUB_OUTPUT"
            echo "run_flutter=true" >> "$GITHUB_OUTPUT"
            echo "run_resident=true" >> "$GITHUB_OUTPUT"
            echo "run_guard=true" >> "$GITHUB_OUTPUT"
            echo "run_dependency_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Ev '^(docs/|[^/]+\.md$)' /tmp/aaraagate-changed-files.txt >/dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "release_control_only=false" >> "$GITHUB_OUTPUT"
            echo "run_api=false" >> "$GITHUB_OUTPUT"
            echo "run_admin=false" >> "$GITHUB_OUTPUT"
            echo "run_flutter=false" >> "$GITHUB_OUTPUT"
            echo "run_resident=false" >> "$GITHUB_OUTPUT"
            echo "run_guard=false" >> "$GITHUB_OUTPUT"
            echo "run_dependency_audit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "docs_only=false" >> "$GITHUB_OUTPUT"

          release_control_only="$(node scripts/classify-release-control-change.mjs "$BASE_SHA" "${{ github.sha }}")"
          echo "release_control_only=$release_control_only" >> "$GITHUB_OUTPUT"
          if [ "$release_control_only" = "true" ]; then
            node scripts/check-secret-patterns.mjs
            echo "run_api=false" >> "$GITHUB_OUTPUT"
            echo "run_admin=false" >> "$GITHUB_OUTPUT"
            echo "run_flutter=false" >> "$GITHUB_OUTPUT"
            echo "run_resident=false" >> "$GITHUB_OUTPUT"
            echo "run_guard=false" >> "$GITHUB_OUTPUT"
            echo "run_dependency_audit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_api=false
          run_admin=false
          run_flutter=false
          run_resident=false
          run_guard=false
          run_dependency_audit=false

          if grep -Eq '^services/api/' /tmp/aaraagate-changed-files.txt; then
            run_api=true
          fi
          if grep -Eq '^apps/admin/' /tmp/aaraagate-changed-files.txt; then
            run_admin=true
          fi
          if grep -Eq '^apps/resident/' /tmp/aaraagate-changed-files.txt; then
            run_flutter=true
            run_resident=true
          fi
          if grep -Eq '^apps/guard/' /tmp/aaraagate-changed-files.txt; then
            run_flutter=true
            run_guard=true
          fi
          if grep -Eq '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' /tmp/aaraagate-changed-files.txt; then
            run_dependency_audit=true
          fi

          # Cross-cutting build/config changes conservatively validate all surfaces.
          # Pure versioned semantic contracts are executed by Repository structure and
          # must not wake unrelated API/Admin/Flutter runners by themselves.
          if grep -Eq '^(\.github/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$)' /tmp/aaraagate-changed-files.txt; then
            run_api=true
            run_admin=true
            run_flutter=true
            run_resident=true
            run_guard=true
          fi
          if grep '^scripts/' /tmp/aaraagate-changed-files.txt | grep -Ev '^scripts/check-v[0-9][0-9A-Za-z._-]*\.mjs$' | grep -q .; then
            run_api=true
            run_admin=true
            run_flutter=true
            run_resident=true
            run_guard=true
          fi

          # Unknown non-doc runtime paths default to full validation rather than under-testing.
          if grep -Ev '^(docs/|[^/]+\.md$|apps/(resident|guard|admin)/|services/api/|\.github/|scripts/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$)' /tmp/aaraagate-changed-files.txt | grep -q .; then
            run_api=true
            run_admin=true
            run_flutter=true
            run_resident=true
            run_guard=true
          fi

          # Reuse the canonical API database/build for benchmark and finance changes.
          # Other develop slices do not pay for the 100k-row benchmark.
          if grep -Eq '^(scripts/performance-smoke.*\.mjs|services/api/scripts/performance-seed\.mjs|services/api/src/accounting/|\.github/workflows/performance-regression\.yml)' /tmp/aaraagate-changed-files.txt; then
            echo "run_performance=true" >> "$GITHUB_OUTPUT"
          fi

          echo "run_api=$run_api" >> "$GITHUB_OUTPUT"
          echo "run_admin=$run_admin" >> "$GITHUB_OUTPUT"
          echo "run_flutter=$run_flutter" >> "$GITHUB_OUTPUT"
          echo "run_resident=$run_resident" >> "$GITHUB_OUTPUT"
          echo "run_guard=$run_guard" >> "$GITHUB_OUTPUT"
          echo "run_dependency_audit=$run_dependency_audit" >> "$GITHUB_OUTPUT"


  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate repository structure
        run: |
          test -f package.json
          test -f pnpm-workspace.yaml
          test -d apps/admin
          test -d apps/resident
          test -d apps/guard
          test -d services/api
          test -d packages/types
          test -d packages/api-client
          test -d packages/config
          test -f scripts/production-preflight.sh
          test -f scripts/check-product-branding.sh
          test -f scripts/check-flutter-release-compatibility.sh
          test -f scripts/check-staging-release-contract.sh
          test -f scripts/hosted-staging-smoke.sh
          test -f scripts/check-hosted-staging-contract.sh
          test -f scripts/check-staging-deployment-template.sh
          test -f scripts/performance-smoke.mjs
          test -f services/api/scripts/performance-seed.mjs
          test -f .github/workflows/performance-regression.yml
          test -f docs/PERFORMANCE-REGRESSION-EVIDENCE.md
          test -f scripts/cross-role-e2e.mjs
          test -f services/api/scripts/cross-role-e2e-seed.mjs
          test -f .github/workflows/cross-role-e2e.yml
          test -f docs/CROSS-ROLE-E2E-EVIDENCE.md
          test -f scripts/validate-hosted-health.mjs
          test -f scripts/check-v2-validation-manifest.mjs
          test -f scripts/check-stable-domain-invariants.mjs
          test -f scripts/check-complexity-boundaries.mjs
          test -f scripts/check-v4.81.1-tenant-observability-readiness.mjs
          test -f docs/AARAAGATE-V4.81.1-TENANT-OBSERVABILITY-READINESS.md
          test -f scripts/check-v4.81.2-maintainability-tenant-hardening.mjs
          test -f docs/AARAAGATE-V4.81.2-MAINTAINABILITY-TENANT-HARDENING.md
          test -f scripts/check-v4.81.3-main-validation-reuse.mjs
          test -f docs/AARAAGATE-V4.81.3-MAIN-VALIDATION-REUSE.md
          test -f scripts/check-v4.81.4-privacy-dependency-hardening.mjs
          test -f docs/AARAAGATE-V4.81.4-PRIVACY-DEPENDENCY-HARDENING.md
          test -f scripts/check-v4.81.5-maintainability-hygiene.mjs
          test -f docs/AARAAGATE-V4.81.5-MAINTAINABILITY-HYGIENE.md
          test -f scripts/check-v4.82-competitive-resident-operations.mjs
          test -f docs/AARAAGATE-V4.82-COMPETITIVE-RESIDENT-OPERATIONS-DEPTH.md
          test -f scripts/check-v4.83-automation-convenience-adoption.mjs
          test -f docs/AARAAGATE-V4.83-AUTOMATION-CONVENIENCE-ADOPTION.md
          test -f scripts/check-v4.83.1-insta-services-entry.mjs
          test -f docs/AARAAGATE-V4.83.1-INSTA-SERVICES-ENTRY.md
          test -f scripts/check-v4.83.2-grounded-operations-copilot.mjs
          test -f docs/AARAAGATE-V4.83.2-GROUNDED-OPERATIONS-COPILOT.md
          test -f scripts/check-v4.84-field-operations-pilot-readiness.mjs
          test -f docs/AARAAGATE-V4.84-FIELD-OPERATIONS-PILOT-READINESS.md
          test -f docs/REPOSITORY-GOVERNANCE.md
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          test -f scripts/open-main-release-pr.sh
          test -f scripts/check-v4.80.12-main-review-routing.mjs
          test -f docs/v2-validation-manifest.json
          bash -n scripts/production-preflight.sh
          bash -n scripts/check-product-branding.sh
          bash -n scripts/check-flutter-release-compatibility.sh
          bash -n scripts/check-staging-release-contract.sh
          bash -n scripts/hosted-staging-smoke.sh
          bash -n scripts/check-hosted-staging-contract.sh
          bash -n scripts/check-staging-deployment-template.sh
          bash -n scripts/open-main-release-pr.sh
      - name: Scan tracked source for high-confidence secret patterns
        run: node scripts/check-secret-patterns.mjs
      - name: Check cross-role source contract
        run: node scripts/v4.34-cross-app-journey-contract.mjs
      - name: Check V4 release evidence contract
        run: node scripts/check-v4-release-evidence.mjs
      - name: Enforce closed Services 3.1 milestone boundary
        env:
          AARAAGATE_PR_TITLE: ${{ github.event.pull_request.title }}
          AARAAGATE_PR_HEAD: ${{ github.head_ref }}
        run: |
          node scripts/check-services-3.1-closure.mjs --self-test
          node scripts/check-services-3.1-closure.mjs
      - name: Test release delay prevention controls
        run: node --test scripts/release-delay-controls.test.mjs scripts/coverage-thresholds.test.mjs
      - name: Check V4.80.12 main review routing
        run: node scripts/check-v4.80.12-main-review-routing.mjs
      - name: Validate release migration control syntax
        run: bash -n scripts/release-migration-gate.sh
      - name: Syntax-check repository invariant scripts
        shell: bash
        run: |
          bash -n scripts/mastermind-preflight.sh
          set -euo pipefail
          for check in scripts/check-*.mjs; do
            node --check "$check"
          done
      - name: Check stable domain invariants
        run: node scripts/check-stable-domain-invariants.mjs
      - name: Check architecture complexity boundaries
        run: node scripts/check-complexity-boundaries.mjs
      - name: Check PostgreSQL parameter contracts
        run: |
          node --test scripts/check-postgres-parameter-contracts.test.mjs
          node scripts/check-postgres-parameter-contracts.mjs
      - name: Test performance benchmark failure handling
        run: node --test scripts/performance-smoke.test.mjs
      - name: Test dependency audit failure handling
        run: node --test scripts/check-dependency-risk-budget.test.mjs
      - name: Check V4.81.1 tenant isolation and observability readiness
        run: node scripts/check-v4.81.1-tenant-observability-readiness.mjs
      - name: Check V4.81.2 maintainability and tenant hardening
        run: node scripts/check-v4.81.2-maintainability-tenant-hardening.mjs
      - name: Check V4.81.3 main validation reuse
        run: node scripts/check-v4.81.3-main-validation-reuse.mjs
      - name: Check V4.81.4 privacy and dependency hardening
        run: node scripts/check-v4.81.4-privacy-dependency-hardening.mjs
      - name: Check V4.81.5 maintainability and hygiene
        run: node scripts/check-v4.81.5-maintainability-hygiene.mjs
      - name: Check V4.82 competitive Resident and Operations Depth
        run: node scripts/check-v4.82-competitive-resident-operations.mjs
      - name: Check V4.83 automation convenience and adoption depth
        run: node scripts/check-v4.83-automation-convenience-adoption.mjs
      - name: Check V4.83.1 Insta Services entry
        run: node scripts/check-v4.83.1-insta-services-entry.mjs
      - name: Check V4.83.2 Grounded Operations Copilot 2.0
        run: node scripts/check-v4.83.2-grounded-operations-copilot.mjs
      - name: Check V4.84 Field Operations and Pilot Readiness
        run: node scripts/check-v4.84-field-operations-pilot-readiness.mjs
      - name: Check V4.79 milestone contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(scripts/check-v4.79*.mjs)
          test "${#checks[@]}" -gt 0
          for check in "${checks[@]}"; do
            echo "Running $check"
            node "$check"
          done
      - name: Check V4.80.11 release identity and artifact traceability
        run: node scripts/check-v4.80.11-release-identity.mjs
      - name: Check required merge-gate orchestration
        run: node scripts/check-required-merge-gates.mjs
      - name: Check lightweight pilot and evidence contracts
        run: |
          node scripts/check-v2-pilot-acceptance-plan.mjs
          node scripts/check-v2-role-uat-plan.mjs
          node scripts/check-v2-security-privacy-controls.mjs
          node scripts/check-v2-policy-pilot-plan.mjs
          node scripts/check-v4.11-pilot-readiness.mjs
          node scripts/check-v4.28-deployable-evidence.mjs
          node scripts/check-v4.29-pilot-evidence-capture.mjs
          node scripts/check-competitive-readiness.mjs
      - name: Check staging release-history classifier
        run: node scripts/check-staging-release-history.mjs --self-test
      - name: Generate and validate V4.36 API contract
        run: node scripts/check-v4.36-api-contract.mjs
      - name: Enforce Aaraagate product branding boundary
        run: bash scripts/check-product-branding.sh
      - name: Check Flutter release compatibility patch
        run: bash scripts/check-flutter-release-compatibility.sh
      - name: Check exact-SHA staging release contract
        run: bash scripts/check-staging-release-contract.sh
      - name: Check hosted staging acceptance contract
        run: bash scripts/check-hosted-staging-contract.sh
      - name: Check hosted staging deployment template
        run: bash scripts/check-staging-deployment-template.sh
      - name: Check V2.4 validation evidence contract
        run: node scripts/check-v2-validation-manifest.mjs
      - name: Exercise production preflight control
        env:
          NODE_ENV: production
          APP_VERSION: ci-preflight-test
          GIT_SHA: 0123456789abcdef
          DATABASE_URL: postgresql://user:pass@db.example.internal:5432/aaraagate
          REDIS_URL: rediss://redis.example.internal:6379
          CORS_ALLOWED_ORIGINS: https://admin.example.com
          OTP_DELIVERY_PROVIDER: msg91
          MSG91_AUTH_KEY: ci-placeholder-auth-key
          MSG91_OTP_TEMPLATE_ID: ci-placeholder-template
          FIREBASE_SERVICE_ACCOUNT_JSON: '{"project_id":"ci-test","client_email":"ci@example.invalid","private_key":"not-a-real-private-key"}'
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
          NEXT_PUBLIC_AARAGATE_API_BASE_URL: https://api.example.com
        run: bash scripts/production-preflight.sh

  mastermind-preflight:
    name: Mastermind preflight
    needs: [change-scope, repository-structure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run structural compatibility preflight
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PREFLIGHT_MODE: structural
          RUN_API: ${{ needs.change-scope.outputs.run_api }}
          RUN_ADMIN: ${{ needs.change-scope.outputs.run_admin }}
          RUN_RESIDENT: ${{ needs.change-scope.outputs.run_resident }}
          RUN_GUARD: ${{ needs.change-scope.outputs.run_guard }}
        run: >-
          bash scripts/mastermind-preflight.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
      - name: Non-PR preflight no-op
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Mastermind preflight is enforced on pull requests; main push reuse remains governed by existing exact-staging-tree logic."

  api-validation-full:
    name: API validation (full)
    needs: [change-scope, repository-structure, mastermind-preflight]
    if: needs.change-scope.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaraagate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aaraagate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaraagate_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @aaraagate/api prisma:validate
      - name: Generate Prisma client
        run: pnpm --filter @aaraagate/api prisma:generate
      - name: Apply Prisma migrations to clean PostgreSQL
        run: pnpm --filter @aaraagate/api prisma:migrate:deploy
      - name: Lint API
        run: pnpm --filter @aaraagate/api lint
      - name: Typecheck API
        run: pnpm --filter @aaraagate/api typecheck
      - name: Test PostgreSQL workflows before broad regression
        run: pnpm --filter @aaraagate/api exec vitest run src/prisma/interval-workflows.postgres.spec.ts src/notifications/push-delivery-outbox.postgres.spec.ts
      - name: Finance concurrency and reconciliation acceptance (disposable PostgreSQL)
        env:
          AARAAGATE_FINANCE_CONCURRENCY_CI: '1'
        run: pnpm --filter @aaraagate/api exec vitest run src/accounting/finance-concurrency.postgres.spec.ts
      - name: Bank provenance and Tally CSV acceptance (disposable PostgreSQL)
        env:
          AARAAGATE_FINANCE_CONCURRENCY_CI: '1'
        run: pnpm --filter @aaraagate/api exec vitest run src/accounting/bank-export-acceptance.postgres.spec.ts
      - name: Test API before coverage instrumentation
        run: pnpm --filter @aaraagate/api test
      - name: Build API before coverage instrumentation
        run: pnpm --filter @aaraagate/api build
      - name: Install exact API coverage provider
        run: pnpm --dir services/api add --save-dev --lockfile=false @vitest/coverage-v8@5.0.2
      - name: Regenerate Prisma client after transient coverage install
        run: pnpm --filter @aaraagate/api prisma:generate
      - name: Risk-weighted API coverage gate
        working-directory: services/api
        run: pnpm exec vitest run --config vitest.risk-coverage.config.ts
      - name: Restore API manifest after transient coverage tooling
        if: always()
        run: git checkout -- services/api/package.json
      - name: Upload API risk coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-risk-coverage-${{ github.sha }}
          path: services/api/coverage-risk/
          if-no-files-found: error
          retention-days: 30
      - name: Seed isolated performance fixture after regression suites
        if: needs.change-scope.outputs.run_performance == 'true'
        working-directory: services/api
        run: node scripts/performance-seed.mjs
      - name: Start production-mode API
        env:
          NODE_ENV: production
          REDIS_URL: redis://localhost:6379
          PORT: 3000
          APP_VERSION: ci-runtime-smoke
          GIT_SHA: ${{ github.sha }}
          OTP_DELIVERY_PROVIDER: msg91
          MSG91_AUTH_KEY: ci-placeholder-auth-key
          MSG91_OTP_TEMPLATE_ID: ci-placeholder-template
        run: |
          pnpm --filter @aaraagate/api start > /tmp/aaraagate-ci-api.log 2>&1 &
          echo $! > /tmp/aaraagate-ci-api.pid
      - name: Verify production API readiness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready > /tmp/aaraagate-ci-readiness.json; then
              node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/aaraagate-ci-readiness.json', 'utf8'));
          if (
            h.status !== 'ready' ||
            h.environment !== 'production' ||
            h.version !== 'ci-runtime-smoke' ||
            h.commit !== process.env.EXPECTED_SHA ||
            h.dependencies?.database !== 'ok' ||
            h.dependencies?.authState !== 'redis-ok'
          ) {
            console.error(h);
            process.exit(1);
          }
          NODE
              exit 0
            fi
            sleep 1
          done
          echo "Production-mode API did not become ready"
          cat /tmp/aaraagate-ci-api.log || true
          exit 1
      - name: Run scoped production-mode performance benchmark
        if: needs.change-scope.outputs.run_performance == 'true'
        run: node scripts/performance-smoke.mjs
      - name: Upload scoped benchmark evidence
        if: always() && needs.change-scope.outputs.run_performance == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-performance-${{ github.sha }}
          path: /tmp/aaraagate-performance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop production-mode API
        if: always()
        run: |
          if [ -f /tmp/aaraagate-ci-api.pid ]; then
            kill $(cat /tmp/aaraagate-ci-api.pid) || true
          fi
      - name: Print production API logs on failure
        if: failure()
        run: cat /tmp/aaraagate-ci-api.log || true


  api-validation:
    name: API validation
    needs: [change-scope, api-validation-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve required API validation status
        env:
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          RUN_API: ${{ needs.change-scope.outputs.run_api }}
          FULL_RESULT: ${{ needs.api-validation-full.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ] || [ "$RUN_API" != "true" ]; then
            echo "API surface unchanged: full API validation intentionally skipped."
            exit 0
          fi

          if [ "$FULL_RESULT" = "success" ]; then
            echo "Full API validation passed."
            exit 0
          fi

          echo "Full API validation result: $FULL_RESULT"
          exit 1

  admin-validation-full:
    name: Admin validation (full)
    needs: [change-scope, repository-structure, mastermind-preflight]
    if: needs.change-scope.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Admin access boundaries
        run: pnpm --filter @aaraagate/admin test
      - name: Lint shared Admin components and browser contracts
        run: pnpm --filter @aaraagate/admin lint:ui
      - name: Install Admin browser test runtime
        run: bash scripts/install-admin-browser-runtime.sh
      - name: Test shared Admin component interactions and accessibility
        run: pnpm --filter @aaraagate/admin test:ui
      - name: Typecheck admin
        run: pnpm --filter @aaraagate/admin typecheck
      - name: Build admin
        run: pnpm --filter @aaraagate/admin build
      - name: Retain Admin component visual evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-contract-evidence
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7

  admin-validation:
    name: Admin validation
    needs: [change-scope, admin-validation-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve required Admin validation status
        env:
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          RUN_ADMIN: ${{ needs.change-scope.outputs.run_admin }}
          FULL_RESULT: ${{ needs.admin-validation-full.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ] || [ "$RUN_ADMIN" != "true" ]; then
            echo "Admin surface unchanged: full Admin validation intentionally skipped."
            exit 0
          fi
          test "$FULL_RESULT" = "success"

  flutter-validation-full:
    name: Flutter validation (full)
    needs: [change-scope, repository-structure, mastermind-preflight]
    if: needs.change-scope.outputs.run_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resident dependencies
        if: needs.change-scope.outputs.run_resident == 'true'
        working-directory: apps/resident
        run: flutter pub get
      - name: Changed Resident tests before broad regression
        if: needs.change-scope.outputs.run_resident == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/run-changed-flutter-tests.sh resident "$BASE_SHA" "$HEAD_SHA"
      - name: Risk-weighted Resident behavioural regression gate
        if: needs.change-scope.outputs.run_resident == 'true'
        working-directory: apps/resident
        run: >-
          flutter test --coverage
          test/multi_property_isolation_test.dart
          test/gate_screen_test.dart
          test/billing_screen_test.dart
          test/privacy_data_screen_test.dart
          test/home_action_inbox_dedup_test.dart
          test/community_poll_participation_test.dart
          test/amenities_screen_test.dart
          test/family_member_recovery_test.dart
          test/emergency_contact_recovery_test.dart
          test/workforce_modal_lifecycle_test.dart
          test/notices_acknowledgement_test.dart
      - name: Risk-weighted Resident coverage gate
        if: needs.change-scope.outputs.run_resident == 'true'
        run: node scripts/check-flutter-risk-coverage.mjs apps/resident/coverage/lcov.info resident
      - name: Analyze resident app
        if: needs.change-scope.outputs.run_resident == 'true'
        working-directory: apps/resident
        run: flutter analyze
      - name: Test resident app
        if: needs.change-scope.outputs.run_resident == 'true'
        working-directory: apps/resident
        run: flutter test
      - name: Guard dependencies
        if: needs.change-scope.outputs.run_guard == 'true'
        working-directory: apps/guard
        run: flutter pub get
      - name: Changed Guard tests before broad regression
        if: needs.change-scope.outputs.run_guard == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/run-changed-flutter-tests.sh guard "$BASE_SHA" "$HEAD_SHA"
      - name: Risk-weighted Guard behavioural regression gate
        if: needs.change-scope.outputs.run_guard == 'true'
        working-directory: apps/guard
        run: >-
          flutter test --coverage
          test/offline_recovery_test.dart
          test/guard_realtime_lifecycle_test.dart
          test/guard_workforce_assignment_test.dart
          test/guard_walkin_uncertain_mutation_test.dart
          test/guard_gate_context_isolation_test.dart
      - name: Risk-weighted Guard coverage gate
        if: needs.change-scope.outputs.run_guard == 'true'
        run: node scripts/check-flutter-risk-coverage.mjs apps/guard/coverage/lcov.info guard
      - name: Analyze guard app
        if: needs.change-scope.outputs.run_guard == 'true'
        working-directory: apps/guard
        run: flutter analyze
      - name: Test guard app
        if: needs.change-scope.outputs.run_guard == 'true'
        working-directory: apps/guard
        run: flutter test
      - name: Upload Resident risk coverage evidence
        if: always() && needs.change-scope.outputs.run_resident == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: resident-risk-coverage-${{ github.sha }}
          path: apps/resident/coverage/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Guard risk coverage evidence
        if: always() && needs.change-scope.outputs.run_guard == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: guard-risk-coverage-${{ github.sha }}
          path: apps/guard/coverage/
          if-no-files-found: error
          retention-days: 30

  flutter-validation:
    name: Flutter validation
    needs: [change-scope, flutter-validation-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve required Flutter validation status
        env:
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          RUN_FLUTTER: ${{ needs.change-scope.outputs.run_flutter }}
          FULL_RESULT: ${{ needs.flutter-validation-full.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ] || [ "$RUN_FLUTTER" != "true" ]; then
            echo "Flutter surface unchanged: full Flutter validation intentionally skipped."
            exit 0
          fi
          test "$FULL_RESULT" = "success"

  dependency-security-full:
    name: Dependency security (full)
    needs: [change-scope, repository-structure, mastermind-preflight]
    if: needs.change-scope.outputs.run_dependency_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependency vulnerability budget
        run: node scripts/check-dependency-risk-budget.mjs
      - name: Scan tracked source for high-confidence secret patterns
        run: node scripts/check-secret-patterns.mjs


  dependency-security:
    name: Dependency security
    needs: [change-scope, dependency-security-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve required dependency security status
        env:
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          RELEASE_CONTROL_ONLY: ${{ needs.change-scope.outputs.release_control_only }}
          RUN_DEPENDENCY_AUDIT: ${{ needs.change-scope.outputs.run_dependency_audit }}
          FULL_RESULT: ${{ needs.dependency-security-full.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Documentation-only PR: dependency graph is unchanged and full audit is intentionally skipped."
            exit 0
          fi
          if [ "$RELEASE_CONTROL_ONLY" = "true" ]; then
            echo "Release-control-only PR: dependency graph and product surfaces are unchanged; tracked-secret scan ran in required validation."
            exit 0
          fi
          if [ "$RUN_DEPENDENCY_AUDIT" != "true" ]; then
            echo "Dependency graph unchanged: full package audit skipped; tracked-secret scan passed in Repository structure."
            exit 0
          fi
          test "$FULL_RESULT" = "success"


  required-merge-gates:
    name: Required merge gates
    needs: [repository-structure, api-validation, admin-validation, flutter-validation, dependency-security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve merge readiness
        env:
          REPOSITORY_STRUCTURE: ${{ needs.repository-structure.result }}
          API_VALIDATION: ${{ needs.api-validation.result }}
          ADMIN_VALIDATION: ${{ needs.admin-validation.result }}
          FLUTTER_VALIDATION: ${{ needs.flutter-validation.result }}
          DEPENDENCY_SECURITY: ${{ needs.dependency-security.result }}
        run: |
          printf '%s\n'             "Repository structure: $REPOSITORY_STRUCTURE"             "API validation: $API_VALIDATION"             "Admin validation: $ADMIN_VALIDATION"             "Flutter validation: $FLUTTER_VALIDATION"             "Dependency security: $DEPENDENCY_SECURITY"

          for result in             "$REPOSITORY_STRUCTURE"             "$API_VALIDATION"             "$ADMIN_VALIDATION"             "$FLUTTER_VALIDATION"             "$DEPENDENCY_SECURITY"; do
            test "$result" = "success"
          done

          echo "All required merge gates passed."


  develop-auto-merge:
    name: Develop auto merge
    needs: [required-merge-gates]
    if: ${{ !cancelled() && needs.required-merge-gates.result == 'success' }}
    concurrency:
      group: aaraagate-develop-auto-merge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge exact tested mastermind PR
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Develop auto-merge not applicable: workflow event is $EVENT_NAME."
            exit 0
          fi

          current="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          develop="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$REPOSITORY/branches/develop")"

          current_sha="$(printf '%s' "$current" | jq -r '.head.sha')"
          current_base="$(printf '%s' "$current" | jq -r '.base.ref')"
          current_state="$(printf '%s' "$current" | jq -r '.state')"
          current_draft="$(printf '%s' "$current" | jq -r '.draft')"
          current_repo="$(printf '%s' "$current" | jq -r '.head.repo.full_name')"
          current_ref="$(printf '%s' "$current" | jq -r '.head.ref')"
          current_develop_sha="$(printf '%s' "$develop" | jq -r '.commit.sha')"

          if [ "$current_state" != "open" ]; then
            current_merged="$(printf '%s' "$current" | jq -r '.merged // false')"
            if [ "$current_merged" = "true" ] && [ "$current_sha" = "$EXPECTED_HEAD_SHA" ]; then
              echo "PR #$PR_NUMBER is already merged at the exact tested head $EXPECTED_HEAD_SHA."
              exit 0
            fi
            echo "Develop auto-merge not applicable: PR state is $current_state."
            exit 0
          fi

          if [ "$current_base" != "develop" ]; then
            echo "Develop auto-merge not applicable: base is $current_base."
            exit 0
          fi
          if [ "$current_draft" != "false" ]; then
            echo "Develop auto-merge not applicable: PR is draft."
            exit 0
          fi
          if [ "$current_repo" != "$REPOSITORY" ]; then
            echo "Develop auto-merge not applicable: head repository is $current_repo."
            exit 0
          fi
          case "$current_ref" in
            mastermind/*) ;;
            *) echo "Develop auto-merge not applicable: head branch $current_ref is outside mastermind/*."; exit 0 ;;
          esac

          test "$current_sha" = "$EXPECTED_HEAD_SHA"

          # Never update a PR branch using github.token. GitHub deliberately
          # suppresses pull_request/synchronize CI when that token writes a
          # merge commit, leaving a new untested head with action_required.
          # Preserve exact-head safety and surface an actionable failure.
          require_fresh_base() {
            echo "::error title=Stale PR requires user-authored synchronization::PR #$PR_NUMBER targets an older develop head. Sync the head via an external authorized identity and require green checks on the new SHA. CI will not silently change the branch with github.token."
            exit 1
          }

          if [ "$current_develop_sha" != "$EXPECTED_BASE_SHA" ]; then
            require_fresh_base
          fi

          latest_develop="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/branches/develop")"
          latest_develop_sha="$(printf '%s' "$latest_develop" | jq -r '.commit.sha')"
          if [ "$latest_develop_sha" != "$EXPECTED_BASE_SHA" ]; then
            require_fresh_base
          fi

          response="$(gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/$REPOSITORY/pulls/$PR_NUMBER/merge"             -f merge_method=squash             -f sha="$EXPECTED_HEAD_SHA")"
          merged="$(printf '%s' "$response" | jq -r '.merged // false')"
          message="$(printf '%s' "$response" | jq -r '.message // ""')"
          if [ "$merged" != "true" ]; then
            echo "Exact-head develop merge was not completed: $message" >&2
            exit 1
          fi

          echo "Merged PR #$PR_NUMBER to develop at exact tested head $EXPECTED_HEAD_SHA."

