name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '43 3 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  javascript-typescript:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
