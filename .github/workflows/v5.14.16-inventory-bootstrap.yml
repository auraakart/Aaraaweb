name: V5.14.16 one-time canonical tenant inventory regeneration
on:
  push:
    branches:
      - mastermind/v5.14.16-mixed-push-outbox-scope
permissions:
  contents: write
jobs:
  canonical-register:
    name: Generate exact tenant access inventory
    if: github.repository == 'auraakart/Aaraaweb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and verify canonical inventory
        run: |
          node services/api/scripts/tenant-access-inventory.mjs --write
          node scripts/sync-tenant-access-summary.mjs --write
          node services/api/scripts/tenant-access-inventory.mjs --check
          node scripts/sync-tenant-access-summary.mjs
      - name: Commit only tool-generated evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/v5-tenant-access-inventory.json docs/architecture/V5-TENANT-ACCESS-INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'V5.14.16: regenerate canonical tenant inventory'
            git push origin HEAD:refs/heads/mastermind/v5.14.16-mixed-push-outbox-scope
          fi
