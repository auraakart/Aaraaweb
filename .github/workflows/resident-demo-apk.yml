name: Resident Demo APK

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/resident/**'
      - '.github/workflows/resident-demo-apk.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/resident/**'
      - '.github/workflows/resident-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resident-demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-resident-apk:
    name: Build Resident demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Packaging needs current Android SDK 36 support required by
          # flutter_secure_storage. Product CI remains independently pinned.
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        working-directory: apps/resident
        run: flutter create --platforms=android --project-name aaraagate_resident --org com.aaraaplatforms .

      - name: Restore Resident source and prepare packaging compatibility
        run: |
          git checkout -- apps/resident/pubspec.yaml apps/resident/lib apps/resident/test
          rm -f apps/resident/analysis_options.yaml apps/resident/test/widget_test.dart
          # Flutter 3.32 expects CardThemeData in ThemeData.cardTheme. Keep this
          # packaging-only so the validated 3.24 product source is unchanged.
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' apps/resident/lib/theme/aaraagate_theme.dart
          APP_GRADLE=$(find apps/resident/android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)
          test -n "$APP_GRADLE"
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APP_GRADLE"
          grep -Eq 'compileSdk(Version)?([[:space:]]*=)?[[:space:]]*36' "$APP_GRADLE"
          grep -Eq 'minSdk(Version)?([[:space:]]*=)?[[:space:]]*23' "$APP_GRADLE"

      - name: Enrich demo fixture for showcase build only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/resident/lib/data/demo_resident_repository.dart')
          text = path.read_text()

          def add(section_start, section_end, terminator, payload):
              global text
              a = text.index(section_start)
              b = text.index(section_end, a)
              p = text.rfind(terminator, a, b)
              if p < 0:
                  raise RuntimeError(f'Could not enrich {section_start}')
              text = text[:p] + payload + text[p:]

          add("final List<Map<String, dynamic>> _access = [", "Future<List<Map<String, dynamic>>> households()", "  ];", """
    {'id': 'demo-access-7', 'unitId': 'demo-unit-1', 'subjectType': 'DELIVERY', 'subjectName': 'Flipkart Delivery', 'purpose': 'Electronics parcel', 'status': 'PENDING'},
    {'id': 'demo-access-8', 'unitId': 'demo-unit-1', 'subjectType': 'CAB', 'subjectName': 'Uber - KA 03 MX 7812', 'purpose': 'Airport drop', 'status': 'APPROVED'},
    {'id': 'demo-access-9', 'unitId': 'demo-unit-1', 'subjectType': 'SERVICE_PROVIDER', 'subjectName': 'CoolCare AC Technician', 'purpose': 'AC maintenance', 'status': 'CHECKED_OUT'},
    {'id': 'demo-access-10', 'unitId': 'demo-unit-1', 'subjectType': 'VISITOR', 'subjectName': 'Priya Nair', 'purpose': 'Weekend visit', 'status': 'APPROVED'},
""")

          add("Future<List<Map<String, dynamic>>> households() async => [", "Future<List<Map<String, dynamic>>> accessRequests()", "      ];", """
        {'id': 'demo-household-3', 'unitId': 'demo-unit-3', 'unitNumber': 'C-503', 'buildingName': 'Palm Tower', 'societyName': 'Aaraagate Demo Residency', 'occupancyRole': 'TENANT'},
        {'id': 'demo-household-4', 'unitId': 'demo-unit-4', 'unitNumber': 'D-1502', 'buildingName': 'Oak Tower', 'societyName': 'Aaraagate Demo Residency', 'occupancyRole': 'OWNER'},
""")

          add("Future<List<Map<String, dynamic>>> notices() async => [", "Stream<Map<String, dynamic>> accessEvents()", "      ];", """
        {'id': 'demo-notice-7', 'title': 'Clubhouse renovation update', 'body': 'The first-floor lounge reopens on 12 September.', 'audience': 'OWNER_AND_OCCUPANTS'},
        {'id': 'demo-notice-8', 'title': 'Fire drill on Saturday', 'body': 'A safety drill will begin at 11:00 AM near Gate 2.', 'audience': 'OWNER_AND_OCCUPANTS'},
        {'id': 'demo-notice-9', 'title': 'Vehicle sticker verification', 'body': 'Please verify registered vehicle stickers before 15 September.', 'audience': 'OWNER_AND_OCCUPANTS'},
        {'id': 'demo-notice-10', 'title': 'AGM documents available', 'body': 'Owners can review the annual meeting documents in the society office.', 'audience': 'OWNER_ONLY'},
""")

          add("Future<List<Map<String, dynamic>>> serviceCategories() async => [", "final List<Map<String, dynamic>> _offerings", "      ];", """
        {'id': 'demo-category-7', 'name': 'Pest control'},
        {'id': 'demo-category-8', 'name': 'Car care'},
""")

          add("final List<Map<String, dynamic>> _offerings = const [", "Future<List<Map<String, dynamic>>> serviceOfferings", "  ];", """
    {'id': 'demo-offering-7', 'categoryId': 'demo-category-7', 'name': 'Cockroach treatment', 'description': 'Kitchen and bathroom pest-control service', 'price': 799},
    {'id': 'demo-offering-8', 'categoryId': 'demo-category-8', 'name': 'Car interior cleaning', 'description': 'Vacuuming and interior detailing', 'price': 599},
    {'id': 'demo-offering-9', 'categoryId': 'demo-category-1', 'name': 'Water purifier service', 'description': 'Filter inspection and routine servicing', 'price': 449},
    {'id': 'demo-offering-10', 'categoryId': 'demo-category-5', 'name': 'Refrigerator inspection', 'description': 'Cooling and compressor diagnostic visit', 'price': 549},
""")

          add("Future<List<Map<String, dynamic>>> bookings() async => [", "Future<List<Map<String, dynamic>>> workforce()", "      ];", """
        {'id': 'demo-booking-5', 'offeringId': 'demo-offering-7', 'status': 'CONFIRMED', 'offering': {'name': 'Cockroach treatment'}},
        {'id': 'demo-booking-6', 'offeringId': 'demo-offering-8', 'status': 'COMPLETED', 'offering': {'name': 'Car interior cleaning'}},
        {'id': 'demo-booking-7', 'offeringId': 'demo-offering-9', 'status': 'REQUESTED', 'offering': {'name': 'Water purifier service'}},
        {'id': 'demo-booking-8', 'offeringId': 'demo-offering-10', 'status': 'CONFIRMED', 'offering': {'name': 'Refrigerator inspection'}},
""")

          add("Future<List<Map<String, dynamic>>> workforce() async => [", "Future<List<Map<String, dynamic>>> workforceLeaves()", "      ];", """
        {'id': 'demo-workforce-6', 'assignmentId': 'demo-workforce-6', 'householdId': 'demo-household-1', 'name': 'Deepak', 'phone': '+919800000006', 'role': 'GARDENER', 'active': true},
        {'id': 'demo-workforce-7', 'assignmentId': 'demo-workforce-7', 'householdId': 'demo-household-1', 'name': 'Meena', 'phone': '+919800000007', 'role': 'ELDER_CARE', 'active': true},
        {'id': 'demo-workforce-8', 'assignmentId': 'demo-workforce-8', 'householdId': 'demo-household-1', 'name': 'Suresh', 'phone': '+919800000008', 'role': 'DOG_WALKER', 'active': true},
""")

          add("Future<List<Map<String, dynamic>>> workforceLeaves() async => [", "Future<List<Map<String, dynamic>>> workforceRatings()", "      ];", """
        {'id': 'demo-leave-3', 'assignmentId': 'demo-workforce-2', 'startsOn': '2026-09-18', 'endsOn': '2026-09-19', 'reason': 'Out of station', 'active': true},
        {'id': 'demo-leave-4', 'assignmentId': 'demo-workforce-7', 'startsOn': '2026-09-22', 'endsOn': '2026-09-22', 'reason': 'Medical appointment', 'active': true},
""")

          add("Future<List<Map<String, dynamic>>> workforceRatings() async => [", "Future<List<Map<String, dynamic>>> helpdeskTickets()", "      ];", """
        {'assignmentId': 'demo-workforce-6', 'score': 5, 'comment': 'Keeps the balcony garden healthy'},
        {'assignmentId': 'demo-workforce-7', 'score': 5, 'comment': 'Patient and dependable'},
        {'assignmentId': 'demo-workforce-8', 'score': 4, 'comment': 'Very regular with timings'},
""")

          add("Future<List<Map<String, dynamic>>> helpdeskTickets() async => [", "Future<List<Map<String, dynamic>>> maintenanceInvoices()", "      ];", """
        {'id': 'demo-ticket-5', 'unitId': 'demo-unit-1', 'title': 'Gym treadmill display issue', 'description': 'Display on treadmill 3 is not responding.', 'status': 'OPEN', 'priority': 'NORMAL'},
        {'id': 'demo-ticket-6', 'unitId': 'demo-unit-1', 'title': 'Basement water accumulation', 'description': 'Small puddle near parking slot A-42 after heavy rain.', 'status': 'IN_PROGRESS', 'priority': 'HIGH'},
        {'id': 'demo-ticket-7', 'unitId': 'demo-unit-1', 'title': 'Clubhouse booking clarification', 'description': 'Need confirmation on guest limit for birthday booking.', 'status': 'RESOLVED', 'priority': 'LOW'},
        {'id': 'demo-ticket-8', 'unitId': 'demo-unit-1', 'title': 'Garbage pickup missed', 'description': 'Wet waste pickup was missed this morning.', 'status': 'CLOSED', 'priority': 'NORMAL'},
""")

          add("Future<List<Map<String, dynamic>>> maintenanceInvoices() async => [", "Future<List<Map<String, dynamic>>> maintenancePayments()", "      ];", """
        {'id': 'demo-invoice-6', 'unitId': 'demo-unit-1', 'periodLabel': 'April 2026', 'amount': 4100, 'amountDue': 0, 'status': 'PAID'},
        {'id': 'demo-invoice-7', 'unitId': 'demo-unit-1', 'periodLabel': 'March 2026', 'amount': 4100, 'amountDue': 0, 'status': 'PAID'},
        {'id': 'demo-invoice-8', 'unitId': 'demo-unit-1', 'periodLabel': 'February 2026', 'amount': 3950, 'amountDue': 0, 'status': 'PAID'},
        {'id': 'demo-invoice-9', 'unitId': 'demo-unit-1', 'periodLabel': 'January 2026', 'amount': 3950, 'amountDue': 0, 'status': 'PAID'},
""")

          add("Future<List<Map<String, dynamic>>> maintenancePayments() async => [", "Future<List<Map<String, dynamic>>> helpdeskActivities", "      ];", """
        {'id': 'demo-payment-5', 'invoiceId': 'demo-invoice-6', 'amount': 4100, 'status': 'SUCCESS', 'mode': 'UPI', 'paidAt': '2026-04-06T08:30:00Z'},
        {'id': 'demo-payment-6', 'invoiceId': 'demo-invoice-7', 'amount': 4100, 'status': 'SUCCESS', 'mode': 'CARD', 'paidAt': '2026-03-05T12:20:00Z'},
        {'id': 'demo-payment-7', 'invoiceId': 'demo-invoice-8', 'amount': 3950, 'status': 'SUCCESS', 'mode': 'UPI', 'paidAt': '2026-02-05T07:45:00Z'},
        {'id': 'demo-payment-8', 'invoiceId': 'demo-invoice-9', 'amount': 3950, 'status': 'SUCCESS', 'mode': 'NET_BANKING', 'paidAt': '2026-01-07T10:10:00Z'},
""")

          path.write_text(text)
          PY

      - name: Get dependencies
        working-directory: apps/resident
        run: flutter pub get

      - name: Analyze Resident app for packaging SDK
        working-directory: apps/resident
        # Flutter 3.32 deprecates withOpacity used by source validated on pinned 3.24.
        # Treat those packaging-SDK infos as non-fatal; product CI remains strict.
        run: flutter analyze --no-fatal-infos

      - name: Test Resident app
        working-directory: apps/resident
        run: flutter test

      - name: Verify demo login is present
        run: |
          grep -q "Continue as Demo Resident" apps/resident/lib/auth/auth_screen.dart
          grep -q "AARAGATE_DEMO_MODE" apps/resident/lib/main.dart

      - name: Build debug APK
        working-directory: apps/resident
        env:
          DEMO_API_BASE_URL: ${{ vars.AARAGATE_DEMO_API_BASE_URL }}
        run: |
          DEMO_FLAGS=(--dart-define=AARAGATE_DEMO_MODE=true)
          if [ -n "$DEMO_API_BASE_URL" ]; then
            flutter build apk --debug "${DEMO_FLAGS[@]}" --dart-define=AARAGATE_API_BASE_URL="$DEMO_API_BASE_URL"
          else
            flutter build apk --debug "${DEMO_FLAGS[@]}"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apps/resident/build/app/outputs/flutter-apk/app-debug.apk dist/Aaraagate-Resident-Demo-Latest-UI.apk

      - name: Upload Resident APK
        uses: actions/upload-artifact@v4
        with:
          name: aaraagate-resident-demo-latest-ui-apk
          path: dist/Aaraagate-Resident-Demo-Latest-UI.apk
          if-no-files-found: error
          retention-days: 14
