name: Resident Demo APK

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/resident/**'
      - '.github/workflows/resident-demo-apk.yml'
      - 'scripts/enrich-resident-demo-fixture.py'
  push:
    branches: [develop]
    paths:
      - 'apps/resident/**'
      - '.github/workflows/resident-demo-apk.yml'
      - 'scripts/enrich-resident-demo-fixture.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resident-demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-resident-apk:
    name: Build Resident demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        working-directory: apps/resident
        run: flutter create --platforms=android --project-name aaraagate_resident --org com.aaraaplatforms .

      - name: Restore Resident source and prepare packaging compatibility
        run: |
          git checkout -- apps/resident/pubspec.yaml apps/resident/lib apps/resident/test
          rm -f apps/resident/analysis_options.yaml apps/resident/test/widget_test.dart
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' apps/resident/lib/theme/aaraagate_theme.dart
          APP_GRADLE=$(find apps/resident/android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)
          test -n "$APP_GRADLE"
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APP_GRADLE"
          grep -Eq 'compileSdk(Version)?([[:space:]]*=)?[[:space:]]*36' "$APP_GRADLE"
          grep -Eq 'minSdk(Version)?([[:space:]]*=)?[[:space:]]*23' "$APP_GRADLE"

      - name: Enrich demo fixture for showcase build only
        run: python scripts/enrich-resident-demo-fixture.py

      - name: Get dependencies
        working-directory: apps/resident
        run: flutter pub get

      - name: Analyze Resident app for packaging SDK
        working-directory: apps/resident
        run: flutter analyze --no-fatal-infos

      - name: Test Resident app
        working-directory: apps/resident
        run: flutter test

      - name: Verify demo login is present
        run: |
          grep -q "Continue as Demo Resident" apps/resident/lib/auth/auth_screen.dart
          grep -q "AARAGATE_DEMO_MODE" apps/resident/lib/main.dart

      - name: Build debug APK
        working-directory: apps/resident
        env:
          DEMO_API_BASE_URL: ${{ vars.AARAGATE_DEMO_API_BASE_URL }}
        run: |
          DEMO_FLAGS=(--dart-define=AARAGATE_DEMO_MODE=true)
          if [ -n "$DEMO_API_BASE_URL" ]; then
            flutter build apk --debug "${DEMO_FLAGS[@]}" --dart-define=AARAGATE_API_BASE_URL="$DEMO_API_BASE_URL"
          else
            flutter build apk --debug "${DEMO_FLAGS[@]}"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apps/resident/build/app/outputs/flutter-apk/app-debug.apk dist/Aaraagate-Resident-Demo-Latest-UI.apk

      - name: Upload Resident APK
        uses: actions/upload-artifact@v4
        with:
          name: aaraagate-resident-demo-latest-ui-apk
          path: dist/Aaraagate-Resident-Demo-Latest-UI.apk
          if-no-files-found: error
          retention-days: 14
