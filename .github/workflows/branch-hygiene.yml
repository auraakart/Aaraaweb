name: Branch hygiene

on:
  pull_request:
    branches: [develop]
    types: [closed]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Classify only; do not delete branches'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  branch-hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CLEANUP_BASE: develop
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch all branch refs for local ancestry checks
        shell: bash
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Decide cleanup mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify and clean merged branches
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node scripts/cleanup-merged-branches.mjs

      - name: Publish branch hygiene evidence to job summary
        if: always()
        shell: bash
        run: |
          echo "### Branch hygiene evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -f branch-hygiene-evidence/branch-cleanup.md ]; then
            cat branch-hygiene-evidence/branch-cleanup.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Branch hygiene evidence was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload branch hygiene evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene-evidence-${{ github.run_id }}
          path: branch-hygiene-evidence/
          if-no-files-found: warn
          retention-days: 7
