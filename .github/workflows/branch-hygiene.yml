name: Branch hygiene

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/cleanup-merged-branches.mjs'
      - '.github/workflows/branch-hygiene.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/cleanup-merged-branches.mjs'
      - '.github/workflows/branch-hygiene.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Classify only; do not delete branches'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  branch-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CLEANUP_BASE: develop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide cleanup mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify and clean merged branches
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node scripts/cleanup-merged-branches.mjs

      - name: Upload branch hygiene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene-evidence-${{ github.run_id }}
          path: branch-hygiene-evidence/
          if-no-files-found: error
          retention-days: 30
