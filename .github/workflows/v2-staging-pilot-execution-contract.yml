name: V2 Staging Pilot Execution Contract

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate staging pilot execution record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch staging history
        run: git fetch origin staging:refs/remotes/origin/staging --force
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V2 staging pilot execution record
        run: node scripts/check-v2-staging-pilot-execution.mjs
