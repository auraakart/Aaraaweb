name: V2 Security Privacy Review

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: v2-security-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-review:
    name: Automated security privacy controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V2 security and privacy controls
        run: node scripts/check-v2-security-privacy-controls.mjs
