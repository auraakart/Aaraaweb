name: V5.14.11 one-time canonical inventory bootstrap

on:
  push:
    branches:
      - fix/v5.14.11-report-tenant-read-context

permissions:
  contents: write

jobs:
  canonical-register:
    name: Generate exact tenant inventory for review
    if: github.repository == 'auraakart/Aaraaweb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate source-bound tenant register and human-readable summary
        run: |
          node services/api/scripts/tenant-access-inventory.mjs --write
          node scripts/sync-tenant-access-summary.mjs --write
          node services/api/scripts/tenant-access-inventory.mjs --check
          node scripts/sync-tenant-access-summary.mjs
      - name: Commit generated evidence onto this feature branch only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/v5-tenant-access-inventory.json docs/architecture/V5-TENANT-ACCESS-INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'V5.14.11: update canonical tenant-access inventory from source'
            git push origin HEAD:refs/heads/fix/v5.14.11-report-tenant-read-context
          fi
