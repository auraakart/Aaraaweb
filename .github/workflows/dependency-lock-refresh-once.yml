name: Dependency lock refresh once

on:
  push:
    branches:
      - fix/dedupe-owner-occupant-property-context-20260909

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedupe-owner-occupant-property-context-20260909
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:fix/dedupe-owner-occupant-property-context-20260909
