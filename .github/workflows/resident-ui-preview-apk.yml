name: Resident UI Preview APK

on:
  push:
    branches: [demo/ui-refinement-20261018]

permissions:
  contents: write

concurrency:
  group: resident-ui-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-resident-apk:
    name: Build validated Resident UI demo APK
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated app source
        env:
          UI_SOURCE_SHA: 64c2fd2116e32633281e94cf31bd7fd15fc027dc
        run: |
          git cat-file -e "$UI_SOURCE_SHA^{commit}"
          git diff --exit-code "$UI_SOURCE_SHA" HEAD -- apps/resident packages/branding_runtime scripts/enrich-resident-demo-fixture.py scripts/enrich-resident-demo-fixture-premium.py
          echo "Validated develop app source: $UI_SOURCE_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        working-directory: apps/resident
        run: flutter create --platforms=android --project-name aaraagate_resident --org com.aaraaplatforms .

      - name: Configure and verify Resident speech recognition permissions
        run: node scripts/configure-resident-android-speech.mjs

      - name: Restore validated Resident source and prepare packaging compatibility
        run: |
          git checkout -- apps/resident/pubspec.yaml apps/resident/lib apps/resident/test
          rm -f apps/resident/analysis_options.yaml apps/resident/test/widget_test.dart
          # V4.55 keeps CI, demo packaging and release packaging on Flutter 3.47.
          grep -Fq 'cardTheme: CardThemeData(' apps/resident/lib/theme/aaraagate_theme.dart
          grep -Fq 'dialogTheme: DialogThemeData(' apps/resident/lib/theme/aaraagate_theme.dart
          APP_GRADLE=$(find apps/resident/android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)
          test -n "$APP_GRADLE"
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APP_GRADLE"
          grep -Eq 'compileSdk(Version)?([[:space:]]*=)?[[:space:]]*36' "$APP_GRADLE"
          grep -Eq 'minSdk(Version)?([[:space:]]*=)?[[:space:]]*23' "$APP_GRADLE"

      - name: Enrich showcase fixture during packaging only
        run: python scripts/enrich-resident-demo-fixture-premium.py

      - name: Verify rich marketplace fixture
        run: |
          grep -q "CoolCare Services" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "AirPro Home Care" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "'ratingAverage': 4.8" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "'imageUrl':" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "'offerTitle':" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "'placementType': 'SPONSORED'" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "'membershipTier': 'PREMIUM'" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "Sponsored · paid placement" apps/resident/lib/screens/services_screen.dart
          grep -q "Premium provider" apps/resident/lib/screens/services_screen.dart
          grep -q "'AI_ASSISTANT'" apps/resident/lib/main.dart
          grep -q "demoMode: controller.repository is DemoResidentRepository" apps/resident/lib/main.dart
          grep -q "class AiAssistantScreen" apps/resident/lib/screens/ai_assistant_screen.dart
          grep -q "September residents meeting" apps/resident/lib/data/demo_resident_repository.dart
          grep -q "INV-SEP-2026-A1204" apps/resident/lib/data/demo_resident_repository.dart

      - name: Get dependencies
        working-directory: apps/resident
        run: flutter pub get

      - name: Analyze Resident app for packaging SDK
        working-directory: apps/resident
        run: flutter analyze --no-fatal-infos

      - name: Test Resident app
        working-directory: apps/resident
        run: flutter test

      - name: Verify demo login is enabled in source
        run: |
          grep -q "Continue as Demo Resident" apps/resident/lib/auth/auth_screen.dart
          grep -q "AARAGATE_DEMO_MODE" apps/resident/lib/main.dart

      - name: Build smaller universal release-mode demo APK
        # Flutter's generated wrapper uses demo/debug signing; not store signing.
        working-directory: apps/resident
        env:
          DEMO_API_BASE_URL: ${{ vars.AARAGATE_DEMO_API_BASE_URL }}
        run: |
          DEMO_FLAGS=(--dart-define=AARAGATE_DEMO_MODE=true)
          if [ -n "$DEMO_API_BASE_URL" ]; then
            flutter build apk --release "${DEMO_FLAGS[@]}" --dart-define=AARAGATE_API_BASE_URL="$DEMO_API_BASE_URL"
          else
            flutter build apk --release "${DEMO_FLAGS[@]}"
          fi

      - name: Read Resident release identity
        id: release_identity
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' apps/resident/pubspec.yaml)"
          SEMVER="${VERSION%%+*}"
          test -n "$SEMVER"
          echo "version=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apps/resident/build/app/outputs/flutter-apk/app-release.apk dist/Aaraagate-Resident-Demo-Showcase-V2.apk
          APK=dist/Aaraagate-Resident-Demo-Showcase-V2.apk
          unzip -tq "$APK"
          zipinfo -1 "$APK" > /tmp/aaraagate-demo-apk-entries.txt
          grep -Fxq AndroidManifest.xml /tmp/aaraagate-demo-apk-entries.txt
          grep -Fxq classes.dex /tmp/aaraagate-demo-apk-entries.txt
          grep -Fxq 'lib/arm64-v8a/libflutter.so' /tmp/aaraagate-demo-apk-entries.txt
          echo 'APK archive, Android manifest, bytecode and ARM64 engine verified.'

      - name: Record Resident APK build evidence
        run: |
          APK=dist/Aaraagate-Resident-Demo-Showcase-V2.apk
          test -s "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          {
            echo "### Resident demo APK build"
            echo "- Version: \`${{ steps.release_identity.outputs.build_version }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Size: ${APK_SIZE} bytes"
            echo "- SHA-256: \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Resident APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aaraagate-resident-demo-showcase-v2-apk
          path: dist/Aaraagate-Resident-Demo-Showcase-V2.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish UI preview demo release
        uses: ncipollo/release-action@v1
        with:
          tag: resident-demo-ui-20261018
          commit: ${{ github.sha }}
          name: Aaraagate Resident Demo - UI Preview 18 October 2026
          body: |
            Installable Resident demo preview with the latest validated UI refinements.
            Includes Home, visitor approvals, Staff, Community, Services and shared accessibility improvements.
            Existing brand colours, navigation and demo login are preserved.
            Version: ${{ steps.release_identity.outputs.build_version }}
            Validated application source on develop: 64c2fd2116e32633281e94cf31bd7fd15fc027dc
            Build commit: ${{ github.sha }}
            Source validation: https://github.com/auraakart/Aaraaweb/actions/runs/39060828264
            Download Aaraagate-Resident-Demo-Showcase-V2.apk under Assets using Chrome.
            Open the downloaded APK in Android Files to install, then choose Continue as Demo Resident.
            This is a demo-signed preview, not a production/store release. Main and staging were not promoted.
            If Android reports a signing-key mismatch with an older demo, preserve local data before uninstalling that demo.
          artifacts: dist/Aaraagate-Resident-Demo-Showcase-V2.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: false
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
