name: Temporary Admin Marketplace Codemod

on:
  push:
    branches: [fix/admin-marketplace-access-lifecycle]
    paths:
      - 'scripts/temporary-admin-session-codemod.py'
      - '.github/workflows/temp-admin-marketplace-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-marketplace-access-lifecycle
          fetch-depth: 0
      - name: Apply session codemod
        run: |
          if [ -f scripts/temporary-admin-session-codemod.py ]; then
            python scripts/temporary-admin-session-codemod.py
          fi
      - name: Commit generated admin change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/app/admin-console.tsx
          if git diff --cached --quiet; then
            echo 'No generated change required.'
          else
            git commit -m 'Reject stale unsupported admin sessions'
            git push origin HEAD:fix/admin-marketplace-access-lifecycle
          fi
