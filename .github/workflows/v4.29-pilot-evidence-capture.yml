name: V4.29 Pilot Evidence Capture Contract

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate-v429-pilot-evidence-capture:
    name: Validate V4.29 pilot evidence capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate synthetic evidence-record contract
        run: node scripts/check-v4.29-pilot-evidence-capture.mjs
