name: V4.33 Competitive Readiness Contract

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate-v433-competitive-readiness:
    name: Validate V4.33 competitive readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate competitive readiness reconciliation
        run: node scripts/check-competitive-readiness.mjs
